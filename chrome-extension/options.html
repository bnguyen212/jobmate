<!doctype html>
<html>
	<head>
		<link rel="stylesheet" href="assets/bootstrap-4.1.3.min.css" />
		<link rel="stylesheet" href="options.css" />
	</head>
	<body>
		<h4 style="text-align: center">Airtable Settings</h4>

		<div class="options-row">
			<label for="access-token" class="options-label">Access Token</label>
			<input
				type="password"
				id="access-token"
				class="form-control"
				autocomplete="off"
				spellcheck="false"
				placeholder="Personal access token" />
		</div>
		<div class="options-row">
			<label for="spreadsheet-url" class="options-label">Spreadsheet URL</label>
			<input
				type="text"
				id="spreadsheet-url"
				class="form-control"
				autocomplete="off"
				spellcheck="false"
				placeholder="https://www.airtable.com/appHk3mN9pQr2vWxYz/tblL8nM4pQ6rS3tUv5/viwJp2xK9mNqR5sT8" />
		</div>

		<div class="save-btn"><button id="save" class="btn btn-primary">Save</button></div>

		<script src="airtableUrl.js"></script>
		<script src="options.js"></script>
	</body>
</html>
